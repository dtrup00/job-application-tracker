<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Job Application Tracker</title>
<style>
  :root {
    --bg: #0f1115; --card: #1a1d24; --border: #2a2f3a; --text: #e6e8eb;
    --muted: #8b93a1; --accent: #4f8cff;
    --applied: #3b82f6; --interview: #a855f7; --offer: #22c55e;
    --rejected: #ef4444; --skipped: #6b7280; --ghosted: #eab308;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); }
  header { padding: 32px 24px 16px; }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .sub { color: var(--muted); font-size: 13px; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 24px 48px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin: 20px 0; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .stat .n { font-size: 26px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
  input[type=search], select { background: var(--card); border: 1px solid var(--border);
    color: var(--text); padding: 9px 12px; border-radius: 8px; font-size: 14px; }
  input[type=search] { flex: 1; min-width: 200px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--border); font-size: 14px; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; cursor: pointer; }
  tr:hover td { background: #161922; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #fff; }
  .applied { background: var(--applied); } .interview { background: var(--interview); }
  .offer { background: var(--offer); } .rejected { background: var(--rejected); }
  .skipped { background: var(--skipped); } .ghosted { background: var(--ghosted); color:#000; }
  .empty { text-align: center; color: var(--muted); padding: 48px; }
  body.anon .col-company, body.anon .col-link { display: none; }
  body.has-company .col-company { display: table-cell; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin: 20px 0; }
  .chart-title { margin: 0 0 14px; }
  .bar-row { display: grid; grid-template-columns: 110px 1fr 92px; align-items: center; gap: 12px; margin: 8px 0; }
  .bar-label { font-size: 13px; color: var(--text); text-transform: capitalize; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { background: #0f1115; border: 1px solid var(--border); border-radius: 6px; height: 20px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--interview), var(--offer)); border-radius: 6px 0 0 6px; transition: width .4s; }
  .bar-meta { font-size: 12px; color: var(--muted); text-align: right; }
  .pill { font-size: 12px; color: var(--muted); }
  .resp-yes { color: var(--offer); font-weight: 600; }
  .resp-no { color: var(--muted); }
  .foot { color: var(--muted); font-size: 12px; margin-top: 24px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Job Application Tracker</h1>
    <div class="sub" id="generated">Loading…</div>
  </div>
</header>
<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="card" id="chartCard">
    <h2 class="chart-title">Per-platform response rate</h2>
    <div id="chart"></div>
  </div>
  <div class="controls">
    <input type="search" id="search" placeholder="Search company, title, platform…" />
    <select id="statusFilter"><option value="">All statuses</option></select>
    <select id="platformFilter"><option value="">All platforms</option></select>
  </div>
  <table>
    <thead>
      <tr>
        <th data-sort="company" class="col-company">Company</th>
        <th data-sort="title">Role</th>
        <th data-sort="platform">Platform</th>
        <th data-sort="status">Status</th>
        <th data-sort="appliedAt">Applied</th>
        <th data-sort="daysSince">Days ago</th>
        <th data-sort="response">Response</th>
        <th class="col-link">Link</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">No applications yet. Run the apply/log tools and rebuild.</div>
  <div class="foot">Static dashboard • data from applications.json</div>
</div>
<script>
let ALL = [];
let sortKey = 'appliedAt', sortDir = -1;

const STATUSES = ['applied','interview','offer','rejected','skipped','ghosted'];

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
}

function daysSince(iso) {
  if (!iso) return null;
  const ms = Date.now() - new Date(iso).getTime();
  return Math.max(0, Math.floor(ms / 86400000));
}

const RESPONDED_STATUSES = ['interview', 'offer', 'rejected'];
function hasResponse(a) {
  return !!a.respondedAt || RESPONDED_STATUSES.includes(a.status);
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const sf = document.getElementById('statusFilter').value;
  const pf = document.getElementById('platformFilter').value;

  let rows = ALL.filter(a => {
    const hay = (a.company+' '+a.title+' '+a.platform+' '+(a.notes||'')).toLowerCase();
    return (!q || hay.includes(q)) && (!sf || a.status===sf) && (!pf || a.platform===pf);
  });
  // derived sort keys
  rows.forEach(a => { a.daysSince = daysSince(a.appliedAt); a.response = hasResponse(a) ? 1 : 0; });
  rows.sort((x,y) => {
    let a = x[sortKey], b = y[sortKey];
    if (sortKey === 'daysSince' || sortKey === 'response') { a = a ?? -1; b = b ?? -1; return (a - b) * sortDir; }
    a = (a||'').toString().toLowerCase(); b = (b||'').toString().toLowerCase();
    return a < b ? -sortDir : a > b ? sortDir : 0;
  });

  const tbody = document.getElementById('rows');
  tbody.innerHTML = rows.map(a => {
    const dsen = a.daysSince;
    const daysTxt = dsen === null ? '—' : (dsen === 0 ? 'today' : dsen + 'd');
    const resp = hasResponse(a)
      ? `<span class="resp-yes">✓ ${a.respondedAt ? fmtDate(a.respondedAt) : 'yes'}</span>`
      : `<span class="resp-no">—</span>`;
    return `
    <tr>
      <td class="col-company">${esc(a.company)||'—'}</td>
      <td>${esc(a.title)||'—'}</td>
      <td>${esc(a.platform)||'—'}</td>
      <td><span class="badge ${a.status}">${a.status}</span></td>
      <td>${fmtDate(a.appliedAt)}</td>
      <td><span class="pill">${daysTxt}</span></td>
      <td>${resp}</td>
      <td class="col-link">${a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">open</a>` : '—'}</td>
    </tr>`;
  }).join('');
  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
}

function buildChart() {
  const byPlatform = {};
  ALL.forEach(a => {
    const p = a.platform || 'other';
    byPlatform[p] = byPlatform[p] || { total: 0, responded: 0 };
    byPlatform[p].total++;
    if (hasResponse(a)) byPlatform[p].responded++;
  });
  const entries = Object.entries(byPlatform).sort((a, b) => b[1].total - a[1].total);
  const chart = document.getElementById('chart');
  if (!entries.length) { chart.innerHTML = '<span class="pill">No data yet.</span>'; return; }
  chart.innerHTML = entries.map(([p, s]) => {
    const rate = s.total ? Math.round((s.responded / s.total) * 100) : 0;
    return `<div class="bar-row">
      <span class="bar-label" title="${esc(p)}">${esc(p)}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${rate}%"></span></span>
      <span class="bar-meta">${rate}% (${s.responded}/${s.total})</span>
    </div>`;
  }).join('');
}

function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function buildStats() {
  const counts = {}; STATUSES.forEach(s => counts[s]=0);
  ALL.forEach(a => counts[a.status] = (counts[a.status]||0)+1);
  const el = document.getElementById('stats');
  el.innerHTML = `<div class="stat"><div class="n">${ALL.length}</div><div class="l">Total</div></div>` +
    STATUSES.map(s => `<div class="stat"><div class="n">${counts[s]||0}</div><div class="l">${s}</div></div>`).join('');
}

function buildFilters() {
  const sf = document.getElementById('statusFilter');
  STATUSES.forEach(s => sf.insertAdjacentHTML('beforeend', `<option value="${s}">${s}</option>`));
  const pf = document.getElementById('platformFilter');
  [...new Set(ALL.map(a => a.platform).filter(Boolean))].sort()
    .forEach(p => pf.insertAdjacentHTML('beforeend', `<option value="${p}">${p}</option>`));
}

document.querySelectorAll('th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const k = th.dataset.sort;
    if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = 1; }
    render();
  });
});
['search','statusFilter','platformFilter'].forEach(id =>
  document.getElementById(id).addEventListener('input', render));

fetch('applications.json?_=' + Date.now())
  .then(r => r.json())
  .then(d => {
    ALL = d.applications || [];
    document.getElementById('generated').textContent =
      `${ALL.length} applications • updated ${d.generatedAt ? fmtDate(d.generatedAt) : '—'}`;
    if (d.anonymized) document.body.classList.add('anon');
    // Show the company column whenever any record actually has a company value.
    if (ALL.some(a => a.company)) document.body.classList.add('has-company');
    buildStats(); buildFilters(); buildChart(); render();
  })
  .catch(() => { document.getElementById('generated').textContent = 'Could not load applications.json'; });
</script>
</body>
</html>
